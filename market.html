<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Рыночная лавка</title>

<style>
body {
    font-family: Arial;
    background:#2c3e50;
    color:#fff;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
    margin:0;
}

#ui-panel {
    display:flex;
    justify-content:space-between;
    width:90%;
    max-width:500px;
    margin-bottom:10px;
}

#market-floor {
    width:95vw;
    max-width:500px;
    height:45vh;
    background:#855e42;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    border-radius:12px;
}

#sell-btn {
    padding:12px 25px;
    font-size:18px;
    margin-top:10px;
}
</style>
</head>

<body>

<h1>Рыночная лавка 🏪</h1>

<div id="ui-panel">
<div>🍷 Вино: <span id="wine-count">0</span></div>
<div>🪙 Монеты: <span id="coins-count">0</span></div>
</div>

<div id="market-floor">
<div id="customer-avatar">🧍</div>
<button id="sell-btn" onclick="sellWine()">Продать</button>
</div>

<script>
const wineCountEl = document.getElementById("wine-count");
const coinsCountEl = document.getElementById("coins-count");

// FIX 1: нормальная защита NaN
let totalWineBottles = Number(localStorage.getItem("total_wine_bottles") || 0);

// FIX 2: аккаунт (убрал "undefined/null строки")
let email = localStorage.getItem("current_logged_player");

if (!email || email === "null" || email === "undefined") {
    alert("Нет аккаунта");
    localStorage.removeItem("current_logged_player");
    window.location.href = "index.html";
    throw new Error("No account");
}

// FIX 3: монеты
let coins = Number(localStorage.getItem("market_coins_" + email) || 0);

const price = 2;

function updateUI() {
    wineCountEl.innerText = totalWineBottles;
    coinsCountEl.innerText = coins;
}

// FIX 4: VK (без ошибок и зацикливания)
function checkVkLink() {
    let vkUrl = localStorage.getItem("vk_" + email);

    if (vkUrl) return true;

    const input = prompt("VK: https://vk.com/id12345678");
    if (!input) return false;

    const vk = input.trim();

    if (!/^https:\/\/vk\.com\/id\d+$/.test(vk)) {
        alert("Неверный формат VK");
        return false;
    }

    localStorage.setItem("vk_" + email, vk);
    return true;
}

// FIX 5: продажа
function sellWine() {
    if (totalWineBottles <= 0) {
        alert("Нет вина");
        return;
    }

    if (!checkVkLink()) return;

    const vkUrl = localStorage.getItem("vk_" + email);

    const url = "https://script.google.com/macros/s/AKfycbyz2rvUi_P9yZHJlz3qWqDQyKCzolT_2GxdnKgM3ivXW8z0-IUssQ4jy3QIcTXFH9yU/exec";

    fetch(url + "?vk=" + encodeURIComponent(vkUrl) + "&coins=" + price)
        .then(r => r.json())
        .then(data => {

            if (!data || data.status !== "success") {
                alert("Ошибка сервера");
                return;
            }

            totalWineBottles = Math.max(0, totalWineBottles - 1);
            coins = Number(data.newBalance || 0);

            localStorage.setItem("total_wine_bottles", totalWineBottles);
            localStorage.setItem("market_coins_" + email, coins);

            updateUI();
        })
        .catch(() => alert("Ошибка сети"));
}

updateUI();
</script>

</body>
</html>
