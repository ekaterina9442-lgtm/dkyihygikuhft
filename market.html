<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Рыночная лавка</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #2c3e50; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; overflow: hidden; user-select: none; touch-action: manipulation; }
        h1 { margin: 5px 0; color: #f1c40f; text-shadow: 0 2px 4px rgba(0,0,0,0.5); font-size: 26px; }
        #ui-panel { display: flex; justify-content: space-between; width: 100%; max-width: 500px; font-size: 18px; font-weight: bold; margin-bottom: 10px; background: rgba(0, 0, 0, 0.4); padding: 10px 20px; border-radius: 8px; box-sizing: border-box; border: 1px solid #f1c40f; }
        #coins-count { color: #f1c40f; text-shadow: 0 0 5px #f1c40f; }
        #market-floor { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 95vw; height: 45vh; max-width: 500px; background: #855e42; border: 4px solid #5c3a21; border-radius: 12px; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #counter-top { width: 90%; height: 60px; background: #a0522d; border: 2px solid #5c3a21; border-radius: 4px; display: flex; justify-content: center; align-items: center; font-size: 35px; margin-top: auto; margin-bottom: 20px; box-shadow: inset 0 5px 10px rgba(0,0,0,0.3); }
        #customer-zone { display: flex; flex-direction: column; align-items: center; justify-content: center; margin-top: 20px; height: 120px; }
        #customer-avatar { font-size: 65px; animation: slideIn 0.4s ease-out; }
        #speech-bubble { background: white; color: black; padding: 8px 15px; border-radius: 15px; font-size: 14px; font-weight: bold; margin-bottom: 10px; position: relative; text-align: center; max-width: 250px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); animation: pop 0.3s ease-out; }
        #speech-bubble::after { content: ''; position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%); border-width: 8px 8px 0; border-style: solid; border-color: white transparent; display: block; width: 0; }
        #sell-btn { padding: 12px 30px; font-size: 18px; font-weight: bold; background: #2ecc71; color: white; border: none; border-radius: 25px; cursor: pointer; box-shadow: 0 4px 15px rgba(46,204,113,0.4); transition: 0.2s; }
        #sell-btn:active { transform: scale(0.9); background: #27ae60; }
        .nav-btn { margin-top: 15px; padding: 10px 20px; font-size: 15px; font-weight: bold; background: #34495e; color: white; border: 2px solid #7f8c8d; border-radius: 25px; cursor: pointer; width: 220px; }
        .nav-btn:active { background: #e67e22; border-color: #d35400; }
        @keyframes slideIn { 0% { transform: translateX(100px); opacity: 0; } 100% { transform: translateX(0); opacity: 1; } }
        @keyframes pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <h1>Рыночная лавка 🏪</h1>
    <div id="ui-panel">
        <div>🍷 Вино: <span id="wine-count">0</span> шт</div>
        <div>🪙 Монеты: <span id="coins-count">0</span></div>
    </div>
    
    <div id="market-floor">
        <div id="customer-zone">
            <div id="speech-bubble">Покупаю бутылку за 2 монеты!</div>
            <div id="customer-avatar">🧍</div>
        </div>
        <div id="counter-top">🍾</div>
        <button id="sell-btn" onclick="sellWine()">Продать wine!</button>
    </div>
    
    <button class="nav-btn" onclick="window.location.href='winery.html'">Назад на винодельню 🍷</button>
    <button class="nav-btn" onclick="window.location.href='index.html'">Вернуться к Вененуму </button>

<script>
    const wineCountEl = document.getElementById('wine-count');
    const coinsCountEl = document.getElementById('coins-count');
    const customerAvatar = document.getElementById('customer-avatar');
    const speechBubble = document.getElementById('speech-bubble');
    const counterTop = document.getElementById('counter-top');

    let totalWineBottles = parseInt(localStorage.getItem('total_wine_bottles')) || 0;

    const email = localStorage.getItem('current_logged_player');

    if (!email) {
        alert("Нет аккаунта");
        window.location.href = "index.html";
        throw new Error("No account");
    }

    let coins =
        parseInt(localStorage.getItem('market_coins_' + email)) ||
        parseInt(localStorage.getItem('market_coins')) ||
        0;
    const price = 2;
    const customers = ['🧙‍♂️', '👸', '🏴‍☠️', '🧛', '🎅', '👑'];

    function generateCustomer() {
        customerAvatar.innerText = customers[Math.floor(Math.random() * customers.length)];
        speechBubble.innerText = "Покупаю бутылку за 2 монеты! 🪙";
        customerAvatar.style.animation = 'none';
        customerAvatar.offsetHeight;
        customerAvatar.style.animation = 'slideIn 0.3s ease-out';
        speechBubble.style.animation = 'none';
        speechBubble.offsetHeight;
        speechBubble.style.animation = 'pop 0.2s ease-out';
    }

    function checkVkLink() {
        const email = localStorage.getItem('current_logged_player');

        let coins = 0;

        if (email) {
            coins = parseInt(localStorage.getItem('market_coins_' + email)) || 0;
        } else {
            coins = parseInt(localStorage.getItem('market_coins')) || 0;
        };

        if (!email) {
            alert("Нет аккаунта");
            window.location.href = "index.html";
            return;
        }

        let vkUrl = localStorage.getItem('vk_' + email);

        while (!vkUrl) {
            let input = prompt("Введите ссылку ВК (https://vk.com/id12345678)");

            if (input === null) {
                window.location.href = "winery.html";
                return;
            }

            input = input.trim();

            if (/^https:\/\/vk\.com\/id\d+$/.test(input)) {
                vkUrl = input;
                localStorage.setItem('vk_' + email, vkUrl);
            } else {
                alert("Нужен только ID формат: vk.com/id123...");
            }
         }
     }

    function sellWine() {
        if (totalWineBottles <= 0) {
            alert("У вас нет готового вина на продажу! Зайдите на винодельню 🍷");
            return;
        }
        const email = localStorage.getItem('current_logged_player');
        const vkUrl = localStorage.getItem('vk_' + email);
        if (!vkUrl) {
            checkVkLink();
            return;
        }

        // ВНИМАНИЕ: Замените строчку ниже на вашу реальную ссылку из Google Таблицы (Apps Script)
        const googleScriptUrl = "https://script.google.com/macros/s/AKfycbyz2rvUi_P9yZHJlz3qWqDQyKCzolT_2GxdnKgM3ivXW8z0-IUssQ4jy3QIcTXFH9yU/exec";

        fetch(googleScriptUrl + "?vk=" + encodeURIComponent(vkUrl) + "&coins=" + price)
            .then(response => response.json())
            .then(data => {
                if (data.status === "success") {
                    totalWineBottles--;
                    coins = data.newBalance;
                    localStorage.setItem('total_wine_bottles', totalWineBottles);
                    localStorage.setItem('market_coins_' + email, coins);
                    counterTop.innerText = "🪙💵🪙";
                    setTimeout(() => { counterTop.innerText = "🍾"; }, 500);
                    updateUi();
                    setTimeout(generateCustomer, 600);
                }
            })
            .catch(error => {
                alert("Ошибка сети! Не удалось отправить монеты в таблицу.");
            });
    }

    function updateUi() {
        wineCountEl.innerText = totalWineBottles;
        coinsCountEl.innerText = coins;
    }

    updateUi();

    if (email) {
        checkVkLink();
    }

    generateCustomer();
</script>
</body>
</html>
